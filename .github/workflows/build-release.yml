name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows_x64:
        description: 'Build Windows x64'
        type: boolean
        default: true
      build_windows_x86:
        description: 'Build Windows x86'
        type: boolean
        default: false
      build_windows_arm64:
        description: 'Build Windows ARM64'
        type: boolean
        default: true
      build_macos_x64:
        description: 'Build macOS x64 (Intel)'
        type: boolean
        default: false
      build_macos_arm64:
        description: 'Build macOS ARM64 (Apple Silicon)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ========================================================================
  # Create/ensure the release exists before any build job uploads to it.
  # Running 5 build jobs in parallel that each try to *create* the same
  # release (especially the floating "latest" tag on workflow_dispatch) is a
  # race condition — two jobs can hit the GitHub API at the same moment and
  # one will fail. Creating the release once, up front, and having every
  # build job depend on it via `needs` removes that race. Concurrent asset
  # *uploads* to an already-existing release are fine.
  # ========================================================================
  create-release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}

  # ========================================================================
  # Windows x64
  # ========================================================================
  build-windows-x64:
    needs: create-release
    if: |
      always() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (github.event_name == 'push' || inputs.build_windows_x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg (x64)
        shell: pwsh
        run: |
          # Pinned to FFmpeg 8.1 via GyanD's GitHub mirror (a tagged, permanent release
          # asset) instead of gyan.dev's rolling "ffmpeg-release-essentials.zip" link,
          # which silently changes content whenever upstream ships a new release —
          # breaking build reproducibility and giving no warning when it happens.
          # To bump the version later: check https://github.com/GyanD/codexffmpeg/releases
          # for the new tag name and update both the URL and this comment.
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/8.1/ffmpeg-8.1-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          Rename-Item $dir.Name ffmpeg_bundle
          Remove-Item ffmpeg.zip

      - name: Download Node.js (x64)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.18.0/node-v20.18.0-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Filter "node-v*" | Select-Object -First 1
          Rename-Item $dir.Name node
          Remove-Item node.zip

      - name: PyInstaller build
        run: pyinstaller DouyinLiveRecorder.spec

      - name: Assemble package
        shell: pwsh
        run: |
          $dist = "dist/DouyinLiveRecorder"

          # ffmpeg — copy to ffmpeg/ directory (added to PATH at runtime)
          $ffmpegExe = Get-ChildItem -Recurse ffmpeg_bundle -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -Force -ItemType Directory "$dist/ffmpeg" | Out-Null
          Copy-Item $ffmpegExe.FullName "$dist/ffmpeg/ffmpeg.exe"

          # node — node/ dir (src/__init__.py adds ./node/ to PATH)
          Copy-Item -Recurse node/* "$dist/node/" -Force -ErrorAction SilentlyContinue

          # Default config
          New-Item -Force -ItemType Directory "$dist/config", "$dist/logs" | Out-Null
          Copy-Item config/config.ini "$dist/config/config.ini" -ErrorAction SilentlyContinue
          "" | Out-File -FilePath "$dist/config/URL_config.ini" -Encoding utf8

          # Also copy StopRecording.vbs (upstream includes it)
          Copy-Item StopRecording.vbs "$dist/" -ErrorAction SilentlyContinue

          # Package
          Compress-Archive -Path "$dist/*" -DestinationPath DouyinLiveRecorder_Windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DouyinLiveRecorder_Windows_x64
          path: DouyinLiveRecorder_Windows_x64.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: DouyinLiveRecorder_Windows_x64.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

  # ========================================================================
  # Windows x86 (32-bit)
  # ========================================================================
  build-windows-x86:
    needs: create-release
    if: |
      always() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (github.event_name == 'push' || inputs.build_windows_x86)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg (x86)
        shell: pwsh
        run: |
          # NOTE: gyan.dev and BtbN no longer publish real 32-bit (i686) FFmpeg builds —
          # "all builds are 64-bit". This still pulls the 64-bit build, so the resulting
          # package will NOT run on genuine 32-bit Windows. It works today only because
          # GitHub's windows-latest runner is itself 64-bit, so pyinstaller's x86 Python
          # can still spawn the 64-bit ffmpeg.exe as a subprocess under WOW64. If you need
          # to support real 32-bit Windows hosts, you'll have to compile ffmpeg yourself.
          # Pinned to FFmpeg 8.1 (see the x64 job above for why/how to bump this).
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/8.1/ffmpeg-8.1-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          Rename-Item $dir.Name ffmpeg_bundle
          Remove-Item ffmpeg.zip

      - name: Download Node.js (x86)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.18.0/node-v20.18.0-win-x86.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Filter "node-v*" | Select-Object -First 1
          Rename-Item $dir.Name node
          Remove-Item node.zip

      - name: PyInstaller build
        run: pyinstaller DouyinLiveRecorder.spec

      - name: Assemble package
        shell: pwsh
        run: |
          $dist = "dist/DouyinLiveRecorder"

          $ffmpegExe = Get-ChildItem -Recurse ffmpeg_bundle -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -Force -ItemType Directory "$dist/ffmpeg" | Out-Null
          Copy-Item $ffmpegExe.FullName "$dist/ffmpeg/ffmpeg.exe"

          Copy-Item -Recurse node/* "$dist/node/" -Force -ErrorAction SilentlyContinue

          New-Item -Force -ItemType Directory "$dist/config", "$dist/logs" | Out-Null
          Copy-Item config/config.ini "$dist/config/config.ini" -ErrorAction SilentlyContinue
          "" | Out-File -FilePath "$dist/config/URL_config.ini" -Encoding utf8

          Copy-Item StopRecording.vbs "$dist/" -ErrorAction SilentlyContinue

          # Pre-flight check: fail the build loudly instead of silently shipping a
          # broken package if ffmpeg/node didn't get copied in (the copy above uses
          # SilentlyContinue so a layout change upstream wouldn't otherwise be noticed).
          if (-not (Test-Path "$dist/ffmpeg/ffmpeg.exe")) {
            Write-Error "ffmpeg.exe missing from package - aborting build"
            exit 1
          }
          if (-not (Test-Path "$dist/node/node.exe")) {
            Write-Error "node.exe missing from package - aborting build"
            exit 1
          }

          Compress-Archive -Path "$dist/*" -DestinationPath DouyinLiveRecorder_Windows_x86.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DouyinLiveRecorder_Windows_x86
          path: DouyinLiveRecorder_Windows_x86.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: DouyinLiveRecorder_Windows_x86.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

  # ========================================================================
  # Windows ARM64
  # ========================================================================
  build-windows-arm64:
    needs: create-release
    if: |
      always() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (github.event_name == 'push' || inputs.build_windows_arm64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Verify Python architecture
        # actions/setup-python's arm64-on-Windows support has had gaps in the past
        # (see actions/setup-python#715) — if it silently falls back to an x64
        # interpreter running under emulation, PyInstaller will produce an x64
        # exe, not the native arm64 binary this job is supposed to build. This
        # doesn't fail the build (emulated x64 still runs on arm64 Windows via
        # x64 emulation), but check this log line if you want a truly native build.
        shell: pwsh
        run: python -c "import platform; print('Python machine:', platform.machine())"

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg (ARM64, native)
        shell: pwsh
        run: |
          # gyan.dev only ships 64-bit x86 (win64) builds, NOT arm64 — using it here
          # would silently bundle an x64 ffmpeg.exe into the arm64 package. Use BtbN's
          # native winarm64 build instead.
          # Pinned to a specific dated autobuild tag rather than the "latest" alias,
          # which floats and would silently swap out the binary on every new upstream
          # build. This is a master-branch snapshot (BtbN doesn't tag numbered releases
          # the way gyan.dev does), so its FFmpeg version won't exactly match the 8.1
          # used in the Windows x64/x86 jobs above — acceptable for a native-arch build,
          # but worth knowing. To bump: pick a newer tag from
          # https://github.com/BtbN/FFmpeg-Builds/releases and update the URL below.
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-05-31-13-22/ffmpeg-N-124714-g49a77d37be-winarm64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          Rename-Item $dir.Name ffmpeg_bundle
          Remove-Item ffmpeg.zip

      - name: Download Node.js (ARM64)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.18.0/node-v20.18.0-win-arm64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Filter "node-v*" | Select-Object -First 1
          Rename-Item $dir.Name node
          Remove-Item node.zip

      - name: PyInstaller build
        run: pyinstaller DouyinLiveRecorder.spec

      - name: Assemble package
        shell: pwsh
        run: |
          $dist = "dist/DouyinLiveRecorder"

          $ffmpegExe = Get-ChildItem -Recurse ffmpeg_bundle -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -Force -ItemType Directory "$dist/ffmpeg" | Out-Null
          Copy-Item $ffmpegExe.FullName "$dist/ffmpeg/ffmpeg.exe"

          Copy-Item -Recurse node/* "$dist/node/" -Force -ErrorAction SilentlyContinue

          New-Item -Force -ItemType Directory "$dist/config", "$dist/logs" | Out-Null
          Copy-Item config/config.ini "$dist/config/config.ini" -ErrorAction SilentlyContinue
          "" | Out-File -FilePath "$dist/config/URL_config.ini" -Encoding utf8

          Copy-Item StopRecording.vbs "$dist/" -ErrorAction SilentlyContinue

          # Pre-flight check: fail the build loudly instead of silently shipping a
          # broken package if ffmpeg/node didn't get copied in (the copy above uses
          # SilentlyContinue so a layout change upstream wouldn't otherwise be noticed).
          if (-not (Test-Path "$dist/ffmpeg/ffmpeg.exe")) {
            Write-Error "ffmpeg.exe missing from package - aborting build"
            exit 1
          }
          if (-not (Test-Path "$dist/node/node.exe")) {
            Write-Error "node.exe missing from package - aborting build"
            exit 1
          }

          Compress-Archive -Path "$dist/*" -DestinationPath DouyinLiveRecorder_Windows_arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DouyinLiveRecorder_Windows_arm64
          path: DouyinLiveRecorder_Windows_arm64.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: DouyinLiveRecorder_Windows_arm64.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

  # ========================================================================
  # macOS x64 (Intel)
  # ========================================================================
  build-macos-x64:
    needs: create-release
    if: |
      always() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (github.event_name == 'push' || inputs.build_macos_x64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Download static FFmpeg (Intel)
        run: |
          # NOTE: unlike the Windows sources above, osxexperts.net does NOT publish
          # versioned/dated URLs — this is a single rolling "latest build" link, and
          # the maintainer has stated no historical archive is kept. It genuinely
          # cannot be pinned as-is. If build reproducibility matters here, download a
          # build once, re-upload it as an asset on a release in your own repo, and
          # point this URL at that instead.
          curl -L -o ffmpeg.zip "https://www.osxexperts.net/ffmpeg7intel.zip"
          unzip ffmpeg.zip -d ffmpeg_static
          rm ffmpeg.zip

      - name: Download Node.js (x64)
        run: |
          curl -L -o node.tar.gz "https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-x64.tar.gz"
          tar xzf node.tar.gz
          mv node-v20.18.0-darwin-x64 node_static
          rm node.tar.gz

      - name: PyInstaller build
        run: pyinstaller DouyinLiveRecorder.spec

      - name: Assemble package
        run: |
          dist="dist/DouyinLiveRecorder"

          # Copy static ffmpeg binary
          mkdir -p "$dist/ffmpeg"
          cp ffmpeg_static/ffmpeg "$dist/ffmpeg/ffmpeg"
          chmod +x "$dist/ffmpeg/ffmpeg"

          # Copy the full static node tree (bin/lib/share), matching what the
          # Windows jobs bundle (npm, npx, and node's own lib/node_modules),
          # so `npm`/`npx` work identically across platforms if the app or any
          # bundled JS script ever shells out to them.
          mkdir -p "$dist/node"
          cp -R node_static/* "$dist/node/"
          chmod +x "$dist/node/bin/"*

          # Also place the "node" binary directly at $dist/node/node (not just
          # $dist/node/bin/node) — this matches the Windows layout and the path
          # ("$dist/node/") that src/__init__.py adds to PATH at runtime, so the
          # main app's own `node` lookup keeps working unchanged.
          cp node_static/bin/node "$dist/node/node"
          chmod +x "$dist/node/node"

          # Default config
          mkdir -p "$dist/config" "$dist/logs"
          cp config/config.ini "$dist/config/config.ini" 2>/dev/null || true
          touch "$dist/config/URL_config.ini"

          # Copy macOS launcher script
          cp start_macos.sh "$dist/"
          chmod +x "$dist/start_macos.sh"

          # Remove quarantine attributes (critical for macOS)
          xattr -cr "$dist"

          # Pre-flight check: fail the build loudly instead of silently shipping a
          # broken package if ffmpeg/node didn't get bundled correctly.
          if [ ! -x "$dist/ffmpeg/ffmpeg" ]; then
            echo "::error::ffmpeg missing from package - aborting build"
            exit 1
          fi
          if [ ! -x "$dist/node/node" ]; then
            echo "::error::node missing from package - aborting build"
            exit 1
          fi

          # Package
          cd dist
          zip -r "$GITHUB_WORKSPACE/DouyinLiveRecorder_macOS_x64.zip" DouyinLiveRecorder/

      - uses: actions/upload-artifact@v4
        with:
          name: DouyinLiveRecorder_macOS_x64
          path: DouyinLiveRecorder_macOS_x64.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: DouyinLiveRecorder_macOS_x64.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

  # ========================================================================
  # macOS ARM64 (Apple Silicon)
  # ========================================================================
  build-macos-arm64:
    needs: create-release
    if: |
      always() &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (github.event_name == 'push' || inputs.build_macos_arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Download static FFmpeg (ARM64)
        run: |
          # NOTE: same caveat as the Intel job above — osxexperts.net has no versioned
          # URLs, so this can't be pinned. evermeet.cx is versioned but explicitly does
          # not build for Apple Silicon, so it's not a drop-in replacement here.
          curl -L -o ffmpeg.zip "https://www.osxexperts.net/ffmpeg7arm.zip"
          unzip ffmpeg.zip -d ffmpeg_static
          rm ffmpeg.zip

      - name: Download Node.js (ARM64)
        run: |
          curl -L -o node.tar.gz "https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-arm64.tar.gz"
          tar xzf node.tar.gz
          mv node-v20.18.0-darwin-arm64 node_static
          rm node.tar.gz

      - name: PyInstaller build
        run: pyinstaller DouyinLiveRecorder.spec

      - name: Assemble package
        run: |
          dist="dist/DouyinLiveRecorder"

          # Copy static ffmpeg binary
          mkdir -p "$dist/ffmpeg"
          cp ffmpeg_static/ffmpeg "$dist/ffmpeg/ffmpeg"
          chmod +x "$dist/ffmpeg/ffmpeg"

          # Copy the full static node tree (bin/lib/share), matching what the
          # Windows jobs bundle (npm, npx, and node's own lib/node_modules),
          # so `npm`/`npx` work identically across platforms if the app or any
          # bundled JS script ever shells out to them.
          mkdir -p "$dist/node"
          cp -R node_static/* "$dist/node/"
          chmod +x "$dist/node/bin/"*

          # Also place the "node" binary directly at $dist/node/node (not just
          # $dist/node/bin/node) — this matches the Windows layout and the path
          # ("$dist/node/") that src/__init__.py adds to PATH at runtime, so the
          # main app's own `node` lookup keeps working unchanged.
          cp node_static/bin/node "$dist/node/node"
          chmod +x "$dist/node/node"

          # Default config
          mkdir -p "$dist/config" "$dist/logs"
          cp config/config.ini "$dist/config/config.ini" 2>/dev/null || true
          touch "$dist/config/URL_config.ini"

          # Copy macOS launcher script
          cp start_macos.sh "$dist/"
          chmod +x "$dist/start_macos.sh"

          # Remove quarantine attributes (critical for macOS)
          xattr -cr "$dist"

          # Pre-flight check: fail the build loudly instead of silently shipping a
          # broken package if ffmpeg/node didn't get bundled correctly.
          if [ ! -x "$dist/ffmpeg/ffmpeg" ]; then
            echo "::error::ffmpeg missing from package - aborting build"
            exit 1
          fi
          if [ ! -x "$dist/node/node" ]; then
            echo "::error::node missing from package - aborting build"
            exit 1
          fi

          # Package
          cd dist
          zip -r "$GITHUB_WORKSPACE/DouyinLiveRecorder_macOS_arm64.zip" DouyinLiveRecorder/

      - uses: actions/upload-artifact@v4
        with:
          name: DouyinLiveRecorder_macOS_arm64
          path: DouyinLiveRecorder_macOS_arm64.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: DouyinLiveRecorder_macOS_arm64.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
